<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Historia y Epistemología de las Ciencias Naturales | Mapa del Curso</title>

  <meta
    name="description"
    content="Mapa visual del curso Historia y Epistemología de las Ciencias Naturales. Desarrollado por CINTIA - Universidad de Córdoba."
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #ead6b4;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 0;
    }

    .mapa-curso {
      position: relative;
      width: min(100vw, 1536px);
      margin: 0 auto;
      line-height: 0;
      background: #ead6b4;
    }

    .mapa-curso img {
      display: block;
      width: 100%;
      height: auto;
    }

    .hotspot {
      position: absolute;
      display: block;
      z-index: 3;
      border-radius: 12px;
      text-indent: -9999px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0);
      outline: none;
      line-height: normal;
      transition: background .2s ease, box-shadow .2s ease;
    }

    .hotspot:hover,
    .hotspot:focus-visible {
      background: rgba(255, 248, 234, .14);
      box-shadow:
        0 0 0 3px rgba(176, 141, 87, .85),
        0 0 22px rgba(73, 107, 74, .50);
    }

    /*
      Zonas clicables sobre los botones dibujados en la imagen.
      Imagen base: 1536 x 1024.
    */

    .u1 {
      left: 3.8%;
      top: 73.1%;
      width: 23.5%;
      height: 5.6%;
    }

    .u2 {
      left: 31.2%;
      top: 73.8%;
      width: 28.0%;
      height: 5.8%;
    }

    .u3 {
      left: 66.9%;
      top: 75.1%;
      width: 25.5%;
      height: 5.7%;
    }

    .guia {
      left: 66.9%;
      top: 82.7%;
      width: 25.5%;
      height: 5.7%;
    }

    @media (max-width: 700px) {
      body {
        background: #f3ead8;
      }

      .mapa-curso {
        width: 100vw;
      }
    }
  </style>
</head>

<body>
  <main
    class="mapa-curso"
    aria-label="Mapa visual del curso Historia y Epistemología de las Ciencias Naturales"
  >
    <img
      src="assets/img/portada_mapa_hye.png"
      alt="Mapa visual del curso Historia y Epistemología de las Ciencias Naturales con objetivos, tres unidades, retratos de Karl Popper, Galileo Galilei y José Celestino Mutis, enlaces a los OVA y crédito Desarrollado por CINTIA - Universidad de Córdoba."
    />

    <a
      class="hotspot u1"
      href="https://mtrochez.github.io/ova_cintia_unicor/hye-cn-u1/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir OVA Unidad 1: Introducción a la Epistemología"
      title="Abrir OVA Unidad 1"
    >
      OVA Unidad 1
    </a>

    <a
      class="hotspot u2"
      href="https://mtrochez.github.io/ova_cintia_unicor/hye_cn_u2/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir OVA Unidad 2: Hitos de la Historia de las Ciencias Naturales"
      title="Abrir OVA Unidad 2"
    >
      OVA Unidad 2
    </a>

    <a
      class="hotspot u3"
      href="https://mtrochez.github.io/ova_cintia_unicor/hye_cn_u3/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir OVA Unidad 3: Historia de las Ciencias en Colombia"
      title="Abrir OVA Unidad 3"
    >
      OVA Unidad 3
    </a>

    <a
      class="hotspot guia"
      href="https://mtrochez.github.io/ova_cintia_unicor/hye_gt/index.html"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Abrir Guía Técnica del Entorno"
      title="Abrir Guía Técnica del Entorno"
    >
      Guía Técnica del Entorno
    </a>
  </main>
</body>
</html>
