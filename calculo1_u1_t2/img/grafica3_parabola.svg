    <text x="64" y="300" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">4</text>  <text x="64" y="255" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">6</text>
    <text x="64" y="210" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">8</text>  <text x="64" y="165" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">10</text>
    <text x="64" y="120" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">12</text> <text x="64" y="75" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">14</text>
    <text x="64" y="34" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:11px;font-weight:400;text-anchor:end;dominant-baseline:auto">16</text>
    <text x="22" y="230" font-size="12" transform="rotate(-90,22,230)" style="fill:rgb(85, 85, 85);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:12px;font-weight:400;text-anchor:end;dominant-baseline:auto">f(x)</text>
  </g>

  <!-- Título -->
  <text x="325" y="20" text-anchor="middle" font-size="13" font-family="Arial" fill="#333" style="fill:rgb(51, 51, 51);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Arial;font-size:13px;font-weight:400;text-anchor:middle;dominant-baseline:auto">f(x) = x² - 4x + 3</text>
