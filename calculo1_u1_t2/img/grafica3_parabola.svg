    <line x1="70" y1="162" x2="580" y2="162" style="fill:rgb(0, 0, 0);stroke:rgb(224, 224, 224);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><line x1="70" y1="207" x2="580" y2="207" style="fill:rgb(0, 0, 0);stroke:rgb(224, 224, 224);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <line x1="70" y1="251" x2="580" y2="251" style="fill:rgb(0, 0, 0);stroke:rgb(224, 224, 224);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><line x1="70" y1="296" x2="580" y2="296" style="fill:rgb(0, 0, 0);stroke:rgb(224, 224, 224);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
    <line x1="70" y1="341" x2="580" y2="341" style="fill:rgb(0, 0, 0);stroke:rgb(224, 224, 224);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/><line x1="70" y1="387" x2="580" y2="387" style="fill:rgb(0, 0, 0);stroke:rgb(224, 224, 224);color:rgb(255, 255, 255);stroke-width:0.6px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  </g>

  <!-- Eje X (y=0 → py=387) -->
  <line x1="70" y1="387" x2="580" y2="387" stroke="#3A8FC7" stroke-width="1.4" clip-path="url(#c3)" style="fill:rgb(0, 0, 0);stroke:rgb(58, 143, 199);color:rgb(255, 255, 255);stroke-width:1.4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Eje Y (x=0 → px=212) -->
  <line x1="212" y1="30" x2="212" y2="420" stroke="#3A8FC7" stroke-width="1.4" clip-path="url(#c3)" style="fill:rgb(0, 0, 0);stroke:rgb(58, 143, 199);color:rgb(255, 255, 255);stroke-width:1.4px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Curva f(x)=x²-4x+3
       Points: x from -2.5 to 6.5 step 0.25
       px = 70+(x+2.5)*56.67   py = 420-(y+1.5)*22.29
       x=-2.5 y=15.75  px=70  py=420-383=37
       x=-2   y=15     px=99  py=420-368=52
       x=-1.5 y=10.75  px=127 py=420-274=146  wait recalc:
       y=(-1.5)²-4(-1.5)+3=2.25+6+3=11.25  py=420-(11.25+1.5)*22.29=420-284.4=135.6≈136
       x=-1   y=1+4+3=8      px=156  py=420-(9.5)*22.29=420-211.7=208
       x=-0.5 y=0.25+2+3=5.25 px=184 py=420-(6.75)*22.29=420-150.4=269.6≈270
       x=0    y=3             px=212  py=420-(4.5)*22.29=420-100.3=319.7≈320
       x=0.5  y=0.25-2+3=1.25 px=240 py=420-(2.75)*22.29=420-61.3=358.7≈359
       x=1    y=1-4+3=0       px=269  py=420-(1.5)*22.29=420-33.4=386.6≈387
       x=1.5  y=2.25-6+3=-0.75 px=297 py=420-(.75)*22.29=420-16.7=403.3≈403
       x=2    y=4-8+3=-1      px=326  py=420-(0.5)*22.29=420-11.1=408.9≈409
       x=2.5  y=6.25-10+3=-0.75 px=354 py=403
       x=3    y=9-12+3=0      px=382  py=387
       x=3.5  y=12.25-14+3=1.25 px=411 py=359
       x=4    y=16-16+3=3     px=439  py=320
       x=4.5  y=20.25-18+3=5.25 px=467 py=270
       x=5    y=25-20+3=8     px=496  py=208
       x=5.5  y=30.25-22+3=11.25 px=524 py=136
       x=6    y=36-24+3=15    px=553  py=52
       x=6.5  y=42.25-26+3=19.25 px=581 py=420-464=-44 → clamp 30
  -->
  <polyline clip-path="url(#c3)" fill="none" stroke="#3A8FC7" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" points="70,37 99,52 127,136 156,208 184,270 212,320 240,359 269,387 297,403 326,409 354,403 382,387 411,359 439,320 467,270 496,208 524,136 553,52 575,30" style="fill:none;stroke:rgb(58, 143, 199);color:rgb(255, 255, 255);stroke-width:2.2px;stroke-linecap:round;stroke-linejoin:round;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

